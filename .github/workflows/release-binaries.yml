name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload binary bundles for
        required: true
        type: string
concurrency:
  group: "release-binaries-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Build ${{ matrix.label }} binary bundle
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            executable: s2a
          - os: macos-latest
            label: macOS
            executable: s2a
          - os: windows-latest
            label: Windows
            executable: s2a.exe
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Install Playwright Chromium
        shell: bash
        run: python -m playwright install chromium

      - name: Build standalone bundle
        shell: bash
        run: python scripts/build_binary_release.py

      - name: Smoke test bundled executable
        shell: bash
        run: |
          bundle_dir=$(python - <<'PY'
          from pathlib import Path
          bundle = next(path for path in Path('build/binary-release/release').iterdir() if path.is_dir())
          print(bundle)
          PY
          )
          "$bundle_dir/${{ matrix.executable }}" --help > /tmp/s2a-help.txt
          head -n 20 /tmp/s2a-help.txt

      - name: Upload binary assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(build/binary-release/release/*.zip build/binary-release/release/*.tar.gz)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber