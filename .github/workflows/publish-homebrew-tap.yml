name: Publish Homebrew Tap

on:
  workflow_run:
    workflows: ["Release Binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the shared Homebrew tap
        required: true
        type: string
concurrency:
  group: "publish-homebrew-tap-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  update-homebrew-tap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'release'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      TAP_REPO: krahd/homebrew-tap
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          max_attempts=24
          sleep_seconds=5

          if [[ -z "$version" || "$version" == "$RELEASE_TAG" ]]; then
            echo "Could not derive a release version from tag ${RELEASE_TAG}." >&2
            exit 1
          fi

          macos_name="s2a-${version}-macos-arm64.tar.gz"
          linux_name="s2a-${version}-linux-x86_64.tar.gz"

          for attempt in $(seq 1 "$max_attempts"); do
            release_json=$(gh release view "$RELEASE_TAG" --json assets)

            macos_sha=$(printf '%s' "$release_json" | jq -r --arg name "$macos_name" '.assets[] | select(.name == $name) | .digest // empty' | sed 's/^sha256://')
            linux_sha=$(printf '%s' "$release_json" | jq -r --arg name "$linux_name" '.assets[] | select(.name == $name) | .digest // empty' | sed 's/^sha256://')

            if [[ -n "$macos_sha" && -n "$linux_sha" ]]; then
              echo "Resolved release assets for ${RELEASE_TAG} on attempt ${attempt}."
              break
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Required release assets are missing for tag ${RELEASE_TAG}." >&2
              exit 1
            fi

            echo "Release assets for ${RELEASE_TAG} are not ready yet; retrying in ${sleep_seconds}s (attempt ${attempt}/${max_attempts})."
            sleep "$sleep_seconds"
          done

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MACOS_ARM64_SHA256=$macos_sha" >> "$GITHUB_ENV"
          echo "LINUX_X86_64_SHA256=$linux_sha" >> "$GITHUB_ENV"

      - name: Clone shared tap repo
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured." >&2
            exit 1
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo

      - name: Render formula
        run: |
          mkdir -p tap-repo/Formula
          python scripts/render_homebrew_formula.py \
            --version "$VERSION" \
            --macos-arm64-sha256 "$MACOS_ARM64_SHA256" \
            --linux-x86-64-sha256 "$LINUX_X86_64_SHA256" \
            --output tap-repo/Formula/s2a.rb

      - name: Commit and push tap update
        working-directory: tap-repo
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Formula/s2a.rb; then
            echo "Formula already up to date."
            exit 0
          fi

          git add Formula/s2a.rb
          git commit -m "Update s2a formula for ${RELEASE_TAG}"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if ! git pull --rebase origin main; then
              echo "Rebase failed while preparing the tap update." >&2
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Pushed tap update on attempt ${attempt}."
              exit 0
            fi

            if [[ "$attempt" -lt "$max_attempts" ]]; then
              echo "Tap repo changed during push; retrying (${attempt}/${max_attempts})."
            fi
          done

          echo "Unable to push tap update after ${max_attempts} attempts." >&2
          exit 1
