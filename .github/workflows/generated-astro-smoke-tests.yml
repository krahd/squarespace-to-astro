name: Generated Astro Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    name: Smoke tests + build generated sites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dev dependencies
        shell: bash
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e '.[dev]'

      - name: Run Python tests
        shell: bash
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Detect generated projects
        id: detect
        shell: bash
        run: |
          if [ -d generated ] && [ -n "$(ls -A generated)" ]; then
            echo "has_generated=true" >> $GITHUB_OUTPUT
          else
            echo "has_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright browsers
        if: steps.detect.outputs.has_generated == 'true'
        shell: bash
        run: |
          . .venv/bin/activate
          python -m playwright install chromium
      - name: Cache Playwright browsers
        if: steps.detect.outputs.has_generated == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-browsers-v1

      - name: Build generated Astro projects (if present)
        if: steps.detect.outputs.has_generated == 'true'
        shell: bash
        run: |
          set -e
          for d in generated/*; do
            if [ -f "$d/package.json" ]; then
              echo "Building $d"
              pushd "$d"
              npm ci
              # allow build to be a no-op in some template projects
              npm run build || npm run build --if-present || true
              popd
            fi
          done

      - name: Smoke-test built generated sites
        if: steps.detect.outputs.has_generated == 'true'
        shell: bash
        run: |
          set -e
          # For each generated project that produced a `dist/` directory,
          # serve the static output briefly and use Playwright (Python) to
          # verify the root page loads successfully.
          for d in generated/*; do
            dist_dir="$d/dist"
            if [ -d "$dist_dir" ]; then
              echo "Smoke-testing $d"
              # serve the built static site on localhost:8000
              python -m http.server 8000 --directory "$dist_dir" &>/dev/null &
              PID=$!
              # wait for the server to become available
              for i in $(seq 1 20); do
                if curl -sSf http://127.0.0.1:8000/ >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              # run Playwright check using the venv Python
              . .venv/bin/activate
                python - <<'PY'
                from playwright.sync_api import sync_playwright
                import sys
                try:
                  with sync_playwright() as p:
                    browser = p.chromium.launch()
                    page = browser.new_page()
                    page.goto("http://127.0.0.1:8000/", timeout=10000)
                    if page.status != 200:
                      print("Non-200 status:", page.status)
                      sys.exit(1)
                    content = page.content()
                    if "<html" not in content.lower():
                      print("Unexpected content")
                      sys.exit(1)
                    browser.close()
                except Exception as e:
                  print("Playwright error:", e)
                  sys.exit(1)
                PY
              kill $PID || true
              sleep 1
            fi
          done
