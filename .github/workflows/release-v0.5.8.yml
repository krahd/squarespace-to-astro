name: Release v0.5.8

on:
  push:
    branches: [main]
    paths:
      - release-requests/v0.5.8

permissions:
  contents: write
  actions: write

concurrency:
  group: release-v0.5.8
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.5.8
      RELEASE_VERSION: 0.5.8
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"

      - name: Prepare v0.5.8 sources and documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "0.5.8"
          old_version = "0.5.7"

          def replace_required(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_required("pyproject.toml", 'version = "0.5.7"', 'version = "0.5.8"')
          replace_required("src/s2a/__init__.py", '__version__ = "0.5.7"', '__version__ = "0.5.8"')

          for path in ("README.md", "STATUS.md", "docs/index.html"):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old_version not in text:
                  raise SystemExit(f"Expected {old_version} reference not found in {path}")
              file.write_text(text.replace(old_version, version), encoding="utf-8")

          guide = Path("USER_GUIDE.md")
          text = guide.read_text(encoding="utf-8")
          if "v0.5.7" not in text:
              raise SystemExit("Expected v0.5.7 source-install example not found in USER_GUIDE.md")
          text = text.replace("v0.5.7", "v0.5.8")
          text = text.replace("On `main` / next release, ", "")
          text = text.replace(" (available on `main` / next release)", "")
          text = text.replace("`--upgrade-legacy-assets` (available on `main` / next release)", "`--upgrade-legacy-assets`")
          text = text.replace("`--clean` (available on `main` / next release)", "`--clean`")
          guide.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n\n### Unreleased\n\n"
          replacement = (
              "## [Unreleased]\n\n"
              "## [0.5.8] - 2026-07-24\n\n"
              "### Changed in 0.5.8\n\n"
          )
          if marker not in text:
              raise SystemExit("Expected Unreleased changelog heading not found")
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              "- README and user guide docs now distinguish the tagged `v0.5.7` release from `main` / next-release options such as `--clean` and `--upgrade-legacy-assets`.",
              "- README and user guide documentation now describe `--clean` and `--upgrade-legacy-assets` as part of the tagged release.",
              1,
          )
          changelog.write_text(text, encoding="utf-8")
          PY

          git diff --check
          grep -q 'version = "0.5.8"' pyproject.toml
          grep -q '__version__ = "0.5.8"' src/s2a/__init__.py
          grep -q '^## \[0.5.8\] - 2026-07-24$' CHANGELOG.md

      - name: Install and test release candidate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          python -m playwright install chromium
          python -m pytest -q
          s2a --help > /tmp/s2a-help.txt
          head -n 20 /tmp/s2a-help.txt

      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/s2a/__init__.py README.md USER_GUIDE.md STATUS.md docs/index.html CHANGELOG.md
          git commit -m "Release v0.5.8"
          git push origin HEAD:main

      - name: Remove one-time release trigger
        shell: bash
        run: |
          rm -f .github/workflows/release-v0.5.8.yml release-requests/v0.5.8
          git add -A
          git commit -m "Remove v0.5.8 release trigger"
          git push origin HEAD:main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists." >&2
            exit 1
          fi

          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          cat > /tmp/release-notes.md <<'EOF'
          ## Highlights

          - Extract Vimeo and YouTube references from rendered HTML and Squarespace JSON, including encoded and lazy-loaded video blocks.
          - Preserve privacy hashes required by unlisted Vimeo videos.
          - Write a native `media_manifest.json`, include media details in page snapshots, and report unresolved provider mentions instead of silently undercounting media.
          - Improve route discovery, redirect handling, XML safety, storage-state diagnostics, generated-site validation, and safe output cleaning.
          EOF

          gh release create "$RELEASE_TAG" \
            --title "s2a $RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            --target "$(git rev-parse HEAD)"

      - name: Build and upload release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run release-binaries.yml --ref main -f tag="$RELEASE_TAG"
          sleep 8
          run_id=$(gh run list \
            --workflow release-binaries.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Publish Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run publish-homebrew-tap.yml --ref main -f tag="$RELEASE_TAG"
          sleep 8
          run_id=$(gh run list \
            --workflow publish-homebrew-tap.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify published release and tap formula
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,assets --jq '.tagName, (.assets[].name)'
          gh api repos/krahd/homebrew-tap/contents/Formula/s2a.rb \
            --jq '.content' | base64 --decode > /tmp/s2a.rb
          grep -q 'version "0.5.8"' /tmp/s2a.rb
          grep 'version "0.5.8"' /tmp/s2a.rb
