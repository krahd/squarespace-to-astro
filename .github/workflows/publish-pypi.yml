name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-pypi.yml'
concurrency:
  group: "publish-pypi-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    name: Validate workflow file change
    runs-on: ubuntu-latest
    steps:
      - name: No-op on workflow change
        run: echo "Workflow file change; nothing to execute."

  publish:
    if: github.event_name != 'push'
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: bash
        run: python -m pip install --upgrade build twine

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Build package
        shell: bash
        run: python -m build

      - name: Publish to PyPI (or skip)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "PYPI_API_TOKEN not configured; skipping publish step."
            exit 0
          fi
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive dist/*
