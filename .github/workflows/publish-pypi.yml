name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-pypi.yml'

jobs:
  validate:
    if: github.event_name == 'push'
    name: Validate workflow file change
    runs-on: ubuntu-latest
    steps:
      - name: No-op on workflow change
        run: echo "Workflow file change; nothing to execute."

  publish:
    if: github.event_name != 'push'
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Skip publish when token missing
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        run: |
          echo "PYPI_API_TOKEN not configured; skipping publish step."

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive dist/*
