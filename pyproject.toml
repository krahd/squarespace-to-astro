[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squarespace-to-astro"
version = "0.5.0"
description = "Probe and crawl Squarespace sites into a static-site migration snapshot."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
  "squarespace",
  "astro",
  "migration",
  "static-site-generator",
  "cli",
  "xml-import",
  "web-scraping",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "markdownify>=0.13,<1",
  "playwright>=1.52,<2",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://krahd.github.io/squarespace-to-astro/"
Documentation = "https://krahd.github.io/squarespace-to-astro/"
Repository = "https://github.com/krahd/squarespace-to-astro"
Issues = "https://github.com/krahd/squarespace-to-astro/issues"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pyinstaller>=6,<7",
  "pytest>=8,<9",
]

[project.scripts]
s2a = "s2a.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
